<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Variables</h1>
    <h2>JavaScript Numbers</h2>
    <P>The number can be written with and without decimal for eg :</P>
    <p id="a"></p>
    <h2>JavaScript syntax</h2>
    The let,var,and const  keyword create variables.
    <p id="b"></p>
    <h2>Sumation eg:</h2>
    <p>This sum ;</p>
    <p id="c"></p>
    
    <script>
        document.getElementById("a").innerHTML="The number with decimal is 10.5";
        let x =5;
        const fname = "Ram";
        document.getElementById("b").innerHTML= fname + " is " +x+" years old. "

        let y =4;
        let sum = x + y ;
        document.getElementById("c").innerHTML = sum;
    </script>
</body>
</html>
