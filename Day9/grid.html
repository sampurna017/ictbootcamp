<!DOCTYPE html>
<html lang="en">
<head>
    <style>
.b {
    background-color: black;
    display: grid;
    grid: auto auto;
    gap: 5px;
    padding: 10px;
}
.b div{
    background-color: rgb(4, 70, 70);
    padding: 10px;
    font-size: 30px;
    
}
.b div a{
    grid-area: "a a a a";
}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="b">
        <div class="a">1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
        <div>10</div>
    </div>
    
</body>
</html>
